# 启用对象存储：docker compose -f docker-compose.yml -f docker-compose.object-storage.yml --profile object-storage up -d
services:
  api:
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: discord
      S3_SECRET_KEY: discord-secret
      S3_BUCKET: attachments
    depends_on:
      minio:
        condition: service_healthy
