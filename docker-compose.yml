services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: discord
      POSTGRES_PASSWORD: discord
      POSTGRES_DB: discord
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord -d discord"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    profiles: ["object-storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: discord
      MINIO_ROOT_PASSWORD: discord-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    profiles: ["voice"]
    command:
      [
        "--dev",
        "--bind", "0.0.0.0",
        "--node-ip", "127.0.0.1",
        "--keys", "devkey: devsecret-devsecret-devsecret-1234",
        "--webhook-url", "http://host.docker.internal:8080/api/v1/livekit/webhook",
      ]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      UV_NO_DEV: "1"
      DATABASE_URL: postgresql+asyncpg://discord:discord@postgres:5432/discord
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: change-me-in-production-please-32bytes
      MEDIA_BASE_URL: http://127.0.0.1:8081/media
    ports:
      - "8081:8080"
    volumes:
      - upload-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
  upload-data:
