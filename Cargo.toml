[package]
name = "discord-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
livekit = { version = "0.12.1", optional = true }
gpui-kit = "0.10.0"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tungstenite = { version = "0.24.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2.12.1", features = ["json"] }

[dev-dependencies]
pollster = "0.4"

[features]
default = []
# 真实音视频：需要首次构建下载预编译 libwebrtc（或用 LK_CUSTOM_WEBRTC 指向本地解压目录）
voice-livekit = ["dep:livekit", "dep:tokio"]

[build-dependencies]
cc = "1"
