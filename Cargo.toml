[package]
name = "discord-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
gpui-kit = "0.10.0"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = { version = "0.24.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2.12.1", features = ["json"] }

[dev-dependencies]
pollster = "0.4"

